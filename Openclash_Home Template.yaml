# ========================
# Sub-Store 模板 OpenClash_Home：作为 mihomo 补丁合并进 all VPS_CT 生成的节点
# 由 VM100 /etc/openclash/config/Home.yaml 转换，改动三处：删除 VPS provider；proxies 改为 +proxies；
#   nameserver-policy 的 +.sk9.pp.ua 写成 <+.sk9.pp.ua>
# 合并规则：对象递归合并；数组整体替换；+key 前插；key+ 追加；key! 强制替换；
#   键名本身以 + 开头或以 +/! 结尾时，用 <键名> 包起来转义（尖括号会被去掉）
# ========================
# Clash-ALL_CT 优化配置
# ========================

# 机场节点订阅

proxy-providers:
  Dler:
    url: "https://oics.net/api/v3/download.getFile/7a06b244-b512-4f9e-8306-799ad89599e3?clash=smart&provider=clash.docx"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: http://connectivitycheck.platform.hicloud.com/generate_204
      interval: 300
    proxy: 直连 


# "+proxies" = 插到 Sub-Store 注入的节点（来源订阅 all VPS_CT）前面
+proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}
 # ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895


allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

ntp:
  enable: true
  write-to-system: true

tun:
  enable: true
  stack: mixed   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - China / IP

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

external-controller: 0.0.0.0:9090
# external-ui: ui
# external-ui-name: zashboard
# external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 202.96.128.166
    - 120.196.165.24
    - 223.5.5.5
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:China / Domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true&disable-ipv6=true
    - https://doh.pub/dns-query#disable-qtype-65=true&disable-ipv6=true
    "<+.sk9.pp.ua>":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true   
    "rule-set:fakeipfilter_!cn":
     https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true&disable-ipv6=true
  nameserver:
    - https://8.8.8.8/dns-query#默认代理&ecs=223.5.5.0/24
  fallback:
    - https://8.8.8.8/dns-query#默认代理
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - "+.sk9.pp.ua"
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:China / Domain
    - rule-set:microsoftcn_domain
    - rule-set:applecn_domain
    - rule-set:steamcn_domain




# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 直连
    - 默认代理
    - 家宽
    - 所有-手动
    - 所有-自动
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 美国-故转
    - 英国-故转
    - 韩国-故转
    - 其他-故转
    - VPS-手动
    - 拒绝

proxy-groups:

  # 业务分流组
  - name: 默认代理
    type: select
    proxies: [直连,所有-手动,所有-自动,家宽,香港-故转,台湾-故转,日本-故转,新加坡-故转,美国-故转,英国-故转, 韩国-故转,其他-故转,VPS-手动]
    
  # 本机 192.168.2.210 (VDI) 与 iPad 192.168.2.195 (BBP iPad) 各自的专属出口。家宽放第一位：
  # 这样导入后行为与原来“全部走家宽”完全一致，不会因为落到直连而断开海外服务。
  - name: VDI
    type: select
    proxies: [家宽,默认代理,所有-手动,所有-自动,香港-故转,台湾-故转,日本-故转,新加坡-故转,美国-故转,英国-故转,韩国-故转,其他-故转,VPS-手动,直连]

  - name: BBP iPad
    type: select
    proxies: [家宽,默认代理,所有-手动,所有-自动,香港-故转,台湾-故转,日本-故转,新加坡-故转,美国-故转,英国-故转,韩国-故转,其他-故转,VPS-手动,直连]

  # Windows Update + NTP(time.windows.com) 专属出口，与 sing-box 的 🪟 Windows Update 组一致，香港放第一位（2026-10-05）
  - name: Windows Update
    type: select
    proxies: [香港-手动,美国-手动,英国-手动,VPS-手动,新加坡-手动,日本-手动,韩国-手动,家宽,直连]


  - {name: Netflix, <<: *default}
  - {name: Crypto, <<: *default}
  - {name: AI, <<: *default}
  - {name: Paypal, <<: *default} 
  - {name: Apple, <<: *default}
  - {name: Google, <<: *default}
  - {name: Test, <<: *default}
  - {name: 国内, <<: *default}
  - {name: Youtube, <<: *default}  

  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝|Expire|Traffic|500.00)).)*$"

  - name: 所有-自动
    type: url-test
    include-all: true
    url: http://connectivitycheck.platform.hicloud.com/generate_204
    tolerance: 50
    interval: 300
    filter: "^((?!(直连|拒绝|Expire|Traffic|500.00)).)*$"
 
  - name: Porn
    type: select
    proxies:
      - 香港-故转
      - 美国-故转
      - 英国-故转
      - 日本-故转
      - 韩国-故转      
      - 台湾-故转
      - 其他-故转
      - 所有-手动
      - VPS-手动
      
  - name: 🐟漏网之鱼 
    type: select
    proxies:
      - 直连
      - 默认代理
      - 香港-故转
      - 台湾-故转
      - 日本-故转
      - 新加坡-故转
      - 美国-故转
      - 英国-故转
      - 韩国-故转
      - 其他-故转
      - VPS-手动

  # 家宽组
  - name: 家宽
    type: select
    include-all: true
    filter: "(?=.*(Home)).*$"  
  
  # UHD组
  - name: UHD
    type: select
    proxies:
      - 直连
      - 默认代理
      - 香港-故转
      - 台湾-故转
      - 日本-故转
      - 新加坡-故转
      - 美国-故转
